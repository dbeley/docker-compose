---
services:
  filebrowser-quantum:
    image: gtstef/filebrowser:stable
    container_name: filebrowser-quantum
    env_file: .env
    volumes:
      - $SOURCE_FOLDER:/srv
      - filebrowser-quantum-data:/home/filebrowser/data
      - ./config.yaml:/home/filebrowser/data/config.yaml
    # ports:
      # - 80:80
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser-quantum.entrypoints=insecure"
      - "traefik.http.routers.filebrowser-quantum.rule=Host(`files-quantum.$DOMAIN`)"
      - "traefik.http.services.filebrowser-quantum.loadbalancer.server.port=80"
      # - "traefik.http.routers.filebrowser-quantum.tls.certresolver=le"

networks:
  default:
    name: $DEFAULT_NETWORK
    external: true

volumes:
  filebrowser-quantum-data: